<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rocket Blaster</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" href="airplane.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="hud">
      <div class="title-row">
        <h1>
          <img src="rocketimg.png" alt="Rocket" class="title-rocket-icon" />
          Rocket Blaster
        </h1>
        <img src="meephappy.png" alt="Happy character" class="title-meephappy-icon" />
      </div>
      <p>Mouse, touch, or arrow keys steer — space or the fire button blasts asteroids. One crash and you're done!</p>
      <div id="score-line">Score: <span id="score">0</span> &nbsp;·&nbsp; Best: <span id="best-score">0</span></div>
      <div id="level-line">Level: <span id="level-number">1</span> &nbsp;·&nbsp; Boost: <span id="boost-value">100</span>%</div>
      <div id="controls">
        <button class="color-btn active" data-color="f25346" style="background:#f25346" title="Coral"></button>
        <button class="color-btn" data-color="4fd8e0" style="background:#4fd8e0" title="Cyan"></button>
        <button class="color-btn" data-color="9b5de5" style="background:#9b5de5" title="Violet"></button>
        <button class="color-btn" data-color="ffd23f" style="background:#ffd23f" title="Gold"></button>
        <button class="color-btn" data-color="06d6a0" style="background:#06d6a0" title="Emerald"></button>
        <button id="view-cycle">View: Follow</button>
      </div>
    </div>

    <div id="joystick">
      <div id="joystick-handle"></div>
    </div>

    <div id="mobile-controls">
      <div id="fire-btn"><span>SPACE</span><small>Fire</small></div>
      <div id="alt-fire-btn"><span>F</span><small>Mode</small></div>
      <div id="boost-btn"><span>B</span><small>Boost</small></div>
    </div>

    <div id="alert-box"></div>

    <div id="game-over">
      <div id="game-over-panel">
        <h2>💥 Crashed!</h2>
        <p>Score: <span id="final-score">0</span></p>
        <button id="restart-btn">Fly Again</button>
      </div>
    </div>

    <div id="world"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r71/three.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
